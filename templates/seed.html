<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <%- include('/partials/head') %>
    <style>
      @font-face {
        font-family: '<%= WEBSITE_FONT.name %>';
        src: url('<%= "/assets/fonts/ + WEBSITE_FONT.name + ".ttf" %>') format('truetype');
      }
    </style>
</head>

<body class="bg-[#F9F9F9] text-gray-900 antialiased min-h-screen flex flex-col">

  <%- include('/partials/site_nav') %>

    <main class="flex-grow">
      <header class="pt-32 pb-16 md:pt-40 md:pb-24 px-6 text-center max-w-[1600px] mx-auto w-full">
        <div class="mb-8 flex justify-center">
          <img src="/assets/avatar.jpg" alt="<%= WEBSITE_TITLE_SUFFIX %>"
            class="w-24 h-24 md:w-28 md:h-28 rounded-full object-cover border border-white/70">
        </div>
      </header>

      <section class="max-w-[1600px] mx-auto w-full px-6 md:px-12 pb-32">


      </section>
    </main>

    <%- include('/partials/footer') %>
</body>

</html>

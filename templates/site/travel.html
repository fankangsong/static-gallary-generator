<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <%- include('/partials/head') %>
  <style>
    <% if (WEBSITE_FONT) { %>@font-face {
      font-family: '<%= WEBSITE_FONT.name %>';
      src: url('<%= "/assets/fonts/site/" + WEBSITE_FONT.name + ".ttf" %>') format('truetype');
      font-weight: normal;
      font-style: normal;
      font-display: swap;
    }

    <% } %>html {
      scrollbar-gutter: stable;
    }

    body {
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      font-family: 'Courier New',
      Courier,
      <%- WEBSITE_FONT ? `'${WEBSITE_FONT.name}' `: '' %>, monospace;
    }

    a:link,
    a:visited {
      color: rgb(240, 80, 55);
      text-decoration: none;
    }

    a:hover,
    a:focus {
      color: rgb(247, 147, 131);
      text-decoration: none;
    }
  </style>
</head>

<body class="bg-[#F9F9F9] text-gray-900 antialiased min-h-screen flex flex-col">

  <%- include('/partials/site_nav') %>

  <main class="flex-grow">
    <header class="pt-32 pb-16 md:pt-40 md:pb-24 px-6 text-center max-w-[1600px] mx-auto w-full">
      <div class="mb-8 flex justify-center">
        <img src="/assets/avatar.jpg" alt="<%= WEBSITE_TITLE_SUFFIX %>"
          class="w-24 h-24 md:w-28 md:h-28 rounded-full object-cover border border-white/70">
      </div>
    </header>

    <section class="max-w-[1600px] mx-auto w-full px-6 md:px-12 pb-32 flex justify-center">
        <iframe
          title="google maps"
          id="google-map"
          class="google-map w-full h-[600px] border-0"
          src="https://www.google.com/maps/d/embed?mid=1ITNU4y9FSrODmHp-Kt6CTbt7uA0"
        ></iframe>
    </section>
  </main>

  <%- include('/partials/footer') %>
</body>

</html>

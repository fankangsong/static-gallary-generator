<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <%- include('/partials/head') %>
    <style>
      <% if (WEBSITE_FONT) {
        %>@font-face {
          font-family: '<%= WEBSITE_FONT.name %>';
          src: url('/assets/fonts/error/<%= WEBSITE_FONT.name %>.ttf') format('truetype');
          font-weight: normal;
          font-style: normal;
          font-display: swap;
        }

        <%
      }

      %>html {
        scrollbar-gutter: stable;
      }

      body {
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        font-family: 'Courier New',
        Courier,
        <%- WEBSITE_FONT ? `'${WEBSITE_FONT.name}' `: '' %>, monospace;
      }

      a:link,
      a:visited {
        color: rgb(240, 80, 55);
        text-decoration: none;
      }

      a:hover,
      a:focus {
        color: rgb(247, 147, 131);
        text-decoration: underline;
      }
    </style>
</head>

<body class="bg-white text-gray-900 flex flex-col min-h-screen">

  <%- include('/partials/site_nav') %>

    <main class="flex-grow flex flex-col items-center justify-center px-4 sm:px-6 lg:px-8 text-center">
      <div class="flex items-center justify-center space-x-2 sm:space-x-4 mb-12 select-none">
        <!-- 4 -->
        <span class="text-8xl sm:text-9xl font-extrabold text-gray-900 tracking-tighter">404</span>
      </div>


    </main>

    <%- include('/partials/footer') %>
</body>

</html>

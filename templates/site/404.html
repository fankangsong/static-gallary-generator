<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <%- include('/partials/head') %>
    <style>
      <% if (WEBSITE_FONT) {
        %>@font-face {
          font-family: '<%= WEBSITE_FONT.name %>';
          src: url('/assets/fonts/error/<%= WEBSITE_FONT.name %>.ttf') format('truetype');
          font-weight: normal;
          font-style: normal;
          font-display: swap;
        }

        <%
      }

      %>html {
        scrollbar-gutter: stable;
      }

      body {
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        font-family: 'Courier New',
        Courier,
        <%- WEBSITE_FONT ? `'${WEBSITE_FONT.name}' `: '' %>, monospace;
      }

      a:link,
      a:visited {
        color: rgb(240, 80, 55);
        text-decoration: none;
      }

      a:hover,
      a:focus {
        color: rgb(247, 147, 131);
        text-decoration: underline;
      }
    </style>
</head>

<body class="bg-white text-gray-900 flex flex-col min-h-screen">

  <%- include('/partials/site_nav') %>

    <main class="flex-grow flex flex-col items-center justify-center px-4 sm:px-6 lg:px-8 text-center">
      <div class="flex items-center justify-center space-x-2 sm:space-x-4 mb-12 select-none">
        <!-- 4 -->
        <span class="text-8xl sm:text-9xl font-extrabold text-gray-900 tracking-tighter">4</span>

        <!-- Icon representing 0 (Camera) -->
        <div class="relative flex items-center justify-center">
          <svg
            class="w-24 h-24 sm:w-32 sm:h-32 text-[rgb(240,80,55)] transform rotate-12 hover:rotate-0 transition-transform duration-500 ease-in-out"
            fill="none" viewBox="0 0 24 24" stroke="currentColor" aria-hidden="true">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"
              d="M3 9a2 2 0 012-2h.93a2 2 0 001.664-.89l.812-1.22A2 2 0 0110.07 4h3.86a2 2 0 011.664.89l.812 1.22A2 2 0 0018.07 7H19a2 2 0 012 2v9a2 2 0 01-2 2H5a2 2 0 01-2-2V9z" />
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"
              d="M15 13a3 3 0 11-6 0 3 3 0 016 0z" />
          </svg>
        </div>

        <!-- 4 -->
        <span class="text-8xl sm:text-9xl font-extrabold text-gray-900 tracking-tighter">4</span>
      </div>

      <a href="/"
        class="inline-flex items-center px-8 py-3 border-2 border-transparent text-base font-medium rounded-full shadow-sm text-white bg-[rgb(240,80,55)] hover:bg-[rgb(247,147,131)] transition-all duration-300 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-[rgb(240,80,55)]">
        Go Back Home
      </a>
    </main>

    <%- include('/partials/footer') %>
</body>

</html>

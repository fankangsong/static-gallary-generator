<!DOCTYPE html>
<html lang="zh-CN">

<head>

  <%- include('/partials/head') %>

    <!-- highlight.js theme -->
    <link rel="stylesheet" href="/assets/css/atom-one-dark.min.css">

    <style>
      @font-face {
        font-family: "<%= WEBSITE_FONT.name %>";
        src: url("./fonts/<%= WEBSITE_FONT.name %>.ttf") format("truetype");
        font-weight: normal;
        font-style: normal;
        font-display: swap;
      }
    </style>

</head>

<body class="bg-white text-gray-900 antialiased">

  <!-- site navigation -->
  <%- include('/partials/site_nav') %>

    <main class="min-h-screen pt-32 pb-12 px-4 sm:px-6 lg:px-8">

      <article class="max-w-3xl mx-auto">

        <header class="mb-12 text-center site-font-family">

          <div class="text-gray-500 text-sm mb-4">
            <%= DATE %>
          </div>

          <h1 class="text-4xl md:text-5xl font-bold tracking-tight mb-8">
            <%= TITLE %>
          </h1>

        </header>

        <!-- article content -->

        <div class="prose prose-lg prose-slate mx-auto heti site-font-family
        prose-headings:font-bold prose-headings:tracking-tight
        prose-strong:font-semibold prose-strong:text-gray-900
        prose-em:italic
        prose-a:text-blue-600 prose-a:no-underline hover:prose-a:underline
        prose-pre:rounded-xl prose-pre:bg-gray-900 prose-pre:text-gray-100 prose-pre:shadow prose-pre:max-w-none
        prose-code:rounded prose-code:bg-gray-900 prose-code:px-1 prose-code:py-0.5 prose-code:text-gray-300 prose-code:before:content-[''] prose-code:after:content-['']
        prose-img:rounded-xl prose-img:shadow-lg">
          <%- CONTENT_HTML %>
        </div>

      </article>

    </main>

    <%- include('/partials/footer') %>

      <!-- highlight.js -->

      <script src="/assets/js/vendor/highlight.min.js"></script>

      <script>
        hljs.highlightAll();
      </script>

</body>

</html>
